services:
  - type: web
    name: little-haven-api
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: little-haven-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: mock
      - key: AI_API_KEY
        value: ""

databases:
  - name: little-haven-db
    plan: free